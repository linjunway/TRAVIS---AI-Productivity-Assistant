[project]
name = "travis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Junway", email = "junway.lin369@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "openai>=3.28.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
travis = "travis:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
